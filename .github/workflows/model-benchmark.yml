name: Inkling 2 Mini live model benchmark

on:
  push:
    branches: [bench/inkling-mini-validation-20261123]
    paths: [.github/workflows/model-benchmark.yml]
  workflow_dispatch:
    inputs:
      reasoning_effort:
        description: Explicit Inkling reasoning effort
        type: choice
        options: [low, high]
        default: low
        required: true

permissions:
  contents: read

jobs:
  live-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCHMARK_REASONING_EFFORT: ${{ inputs.reasoning_effort || 'low' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
          enable-cache: true
          cache-suffix: live-model
      - name: Install locked runtime
        run: uv sync --locked
      - name: Run bounded live requests through the production router
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: >-
          uv run --no-sync python -m rags.model_benchmark run
          --reasoning-effort "$BENCHMARK_REASONING_EFFORT"
          --concurrency 1 2 4 --repetitions 2 --warmup-rounds 1
          --output-tokens 512 --max-duration-seconds 300
          --output reports/testing/inkling-mini-live.json
      - name: Publish live or explicitly blocked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkling-mini-live-model
          path: reports/testing/inkling-mini-live.json
          if-no-files-found: error
