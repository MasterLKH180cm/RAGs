name: RAGs CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAGS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,pdf,mcp,vision]"
      - name: Static analysis
        run: ruff check rags tests --select E4,E7,E9,F
      - name: Labelled retrieval evaluation
        run: python -m rags.evaluate --dataset examples/eval_v02.json --k 3 --generate > evaluation-v02.json
      - name: Integration tests
        run: pytest -q
      - name: Real HTTP smoke test
        shell: bash
        run: |
          uvicorn rags.api:app --host 127.0.0.1 --port 8000 &
          pid=$!
          trap "kill $pid || true" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/live && break
            sleep 1
          done
          curl -fsS -H "Authorization: Bearer local-development-key" http://127.0.0.1:8000/health
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: evaluation-v02.json

  real-encoders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAGS_ENV: test
      RAGS_TEST_COLBERT: "1"
      RAGS_TEST_MULTIMODAL: "1"
      RAGS_TEST_ENCODERS: "1"
      RAGS_MODEL_CACHE: /tmp/rags-model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: /tmp/rags-model-cache
          key: rags-onnx-colbert-clip-v02-${{ runner.os }}
      - run: python -m pip install -e ".[dev,encoders,vision]"
      - name: Actual ColBERT and aligned CLIP inference
        run: pytest -q tests/test_backends.py tests/test_multimodal.py tests/test_semantic_encoder.py
