name: RAGs CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_admission_benchmark:
        description: Run the full frozen admission benchmark with quality enforcement
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ragtest
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: ragtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragtest -d ragtest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAGS_ENV: test
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      RAGS_TEST_POSTGRES_URL: postgresql://ragtest:disposable-ci-password@127.0.0.1:5432/ragtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-suffix: core
          cache-dependency-glob: |
            uv.lock
            requirements/*.txt
      - name: Install locked development dependencies
        run: |
          uv sync --locked --extra dev --extra pdf --extra mcp --extra vision --extra postgres --extra tokenizers
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Bootstrap the vector extension before application connections
        run: |
          python - <<'PYTHON'
          import os
          import psycopg
          with psycopg.connect(os.environ["RAGS_TEST_POSTGRES_URL"], autocommit=True) as connection:
              connection.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PYTHON
      - name: Static analysis
        run: |
          ruff check rags tests scripts conftest.py --select E4,E7,E9,F
          ruff check rags --select B,RUF021
          node --check rags/admin_static/app.js
          node scripts/test_admin_ui.mjs
      - name: Labelled retrieval evaluation
        run: python -m rags.evaluate --dataset examples/eval_v02.json --k 3 --generate > evaluation-v02.json
      - name: Unit contracts with explicit inventory
        run: >-
          python -m pytest -q -m unit --require-no-skips
          --test-inventory reports/testing/inventory-unit.json
          --junitxml reports/testing/junit-unit.xml
          --cov=rags --cov-branch --cov-config=pyproject.toml --cov-report=json:reports/testing/coverage-unit.json
      - name: Integration contracts without optional external resources
        run: >-
          python -m pytest -q -m "integration and not external" --require-no-skips
          --test-inventory reports/testing/inventory-integration.json
          --junitxml reports/testing/junit-integration.xml
          --cov=rags --cov-branch --cov-config=pyproject.toml --cov-append
          --cov-report=json:reports/testing/coverage-core.json
          --cov-report=xml:reports/testing/coverage-core.xml
          --cov-report=html:reports/testing/coverage-html
      - name: Actual PostgreSQL and pgvector contracts included in package coverage
        run: >-
          python -m pytest -q -m postgres --require-no-skips
          --test-inventory reports/testing/inventory-postgres.json
          --junitxml reports/testing/junit-postgres.xml
          --cov=rags --cov-branch --cov-config=pyproject.toml --cov-append
          --cov-report=json:reports/testing/coverage-core.json
          --cov-report=xml:reports/testing/coverage-core.xml
          --cov-report=html:reports/testing/coverage-html
      - name: Actual PostgreSQL Agent Platform process and restart contracts
        env:
          RAGS_E2E_POSTGRES_URL: ${{ env.RAGS_TEST_POSTGRES_URL }}
        run: >-
          python scripts/e2e_agent_platform.py --postgres
          --report reports/testing/agent-platform-postgres.json
      - name: Collection SDK and CLI across actual HTTP and restart boundaries
        run: >-
          python -m pytest -q tests/test_collection_http_e2e.py -m "not postgres"
          --require-no-skips --junitxml reports/testing/collections-http.xml
      - name: Synthetic collection ranking and fork performance evidence
        run: |
          python scripts/benchmark_collections.py --records 200 --iterations 10 \
            --report reports/testing/collections-sqlite-benchmark.json
          python scripts/benchmark_collections.py --postgres --records 200 --iterations 10 \
            --report reports/testing/collections-postgres-benchmark.json
      - name: Synthetic pgvector scoped retrieval performance evidence
        run: |
          mkdir -p reports/testing
          RAGS_DATABASE_URL="$RAGS_TEST_POSTGRES_URL" rags benchmark \
            --documents 40 --chunks-per-document 4 --iterations 5 --json \
            > reports/testing/pgvector-synthetic-benchmark.json
          python - <<'PYTHON'
          import json
          result = json.load(open("reports/testing/pgvector-synthetic-benchmark.json", encoding="utf-8"))
          assert result["workload"] == "synthetic_temp_tables"
          assert result["measurements"]["scoped_revision_join"]["rows"] == 16
          print("Small synthetic pgvector benchmark:", result["measurements"])
          PYTHON
          RAGS_DATABASE_URL="$RAGS_TEST_POSTGRES_URL" rags benchmark \
            --documents 500 --chunks-per-document 8 --iterations 10 --json \
            > reports/testing/pgvector-synthetic-benchmark-large.json
          python - <<'PYTHON'
          import json
          result = json.load(open("reports/testing/pgvector-synthetic-benchmark-large.json", encoding="utf-8"))
          assert result["workload"] == "synthetic_temp_tables"
          assert result["measurements"]["scoped_revision_join"]["rows"] == 400
          assert result["measurements"]["unfiltered_tenant_scan"]["rows"] == 400
          print("Scaled synthetic pgvector benchmark:", result["measurements"])
          PYTHON
      - name: Verify standalone wheel installation and packaged CLI templates
        run: |
          uv build --wheel --out-dir dist
          uv venv --python 3.12 "$RUNNER_TEMP/rags-wheel"
          uv pip install --python "$RUNNER_TEMP/rags-wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/rags-wheel/bin/rags" --help
          "$RUNNER_TEMP/rags-wheel/bin/python" -I - <<'PYTHON'
          from importlib import resources
          from pathlib import Path
          import sys
          root = resources.files("rags").joinpath("admin_static")
          assert Path(str(root)).resolve().is_relative_to(Path(sys.prefix).resolve())
          for name in ("index.html", "style.css", "app.js"):
              assert len(root.joinpath(name).read_bytes()) > 1000
          package = resources.files("rags")
          for name in ("model_benchmark.py", "model_profiles.py", "provider_transport.py",
                       "research/graphrag_adapter.py", "research/hipporag_adapter.py",
                       "research/selfrag_adapter.py", "research/selfrag_runtime.py",
                       "research/crag_adapter.py", "research/crag_web.py",
                       "client.py", "collection_api.py", "collection_service.py", "collection_store.py",
                       "collection_models.py", "collection_filters.py", "collection_search.py", "collection_cli.py",
                       "templates/inkling.env", "templates/inkling-local.env", "templates/litellm.env"):
              assert package.joinpath(name).is_file()
          print("Installed wheel contains the dashboard, Inkling profile and benchmark")
          from tempfile import TemporaryDirectory
          from rags.client import PersistentClient
          with TemporaryDirectory() as directory:
              with PersistentClient(directory + "/records.sqlite", api_key="wheel-local-test-key") as client:
                  notes = client.create_collection("wheel-smoke")
                  notes.add(ids=["one"], documents=["Wheel installation retains source evidence."])
                  assert notes.search(query_texts=["source evidence"], mode="lexical").rows()[0]["id"] == "one"
          assert "rags.api" not in sys.modules
          print("Installed collection SDK executes without importing the application")
          PYTHON
          "$RUNNER_TEMP/rags-wheel/bin/rags" --version | grep -F '0.9.0'
          mkdir -p "$RUNNER_TEMP/rags-wheel-profile"
          "$RUNNER_TEMP/rags-wheel/bin/rags" init --profile offline \
            --directory "$RUNNER_TEMP/rags-wheel-profile"
          "$RUNNER_TEMP/rags-wheel/bin/rags" doctor \
            --env-file "$RUNNER_TEMP/rags-wheel-profile/.env" --no-db --json
          mkdir -p "$RUNNER_TEMP/rags-wheel-inkling"
          "$RUNNER_TEMP/rags-wheel/bin/rags" init --profile inkling \
            --directory "$RUNNER_TEMP/rags-wheel-inkling"
          mkdir -p "$RUNNER_TEMP/rags-wheel-inkling-local"
          "$RUNNER_TEMP/rags-wheel/bin/rags" init --profile inkling-local \
            --directory "$RUNNER_TEMP/rags-wheel-inkling-local"
          "$RUNNER_TEMP/rags-wheel/bin/rags" doctor \
            --env-file "$RUNNER_TEMP/rags-wheel-inkling-local/.env" --no-db --json
          "$RUNNER_TEMP/rags-wheel/bin/python" scripts/check_readme.py --live \
            --report reports/testing/readme-onboarding.json
      - name: Enforce complete-package line and branch floors
        run: python scripts/check_coverage.py
      - name: Publish test inventory, JUnit and coverage evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rags-core-test-evidence
          path: reports/testing/
          if-no-files-found: error
      - name: Real HTTP smoke test
        shell: bash
        run: |
          uvicorn rags.api:app --host 127.0.0.1 --port 8000 &
          pid=$!
          trap "kill $pid || true" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/live && break
            sleep 1
          done
          curl -fsS -H "Authorization: Bearer local-development-key" http://127.0.0.1:8000/health
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: evaluation-v02.json

  agent-platform-browser:
    name: Agent Platform HTTP and actual browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
          enable-cache: true
          cache-suffix: agent-platform-browser
      - name: Install locked runtime and actual Chromium
        run: |
          uv sync --locked --extra e2e
          uv run --no-sync playwright install --with-deps chromium
      - name: Verify live API, model contract, tools, workflow restart and dashboard
        run: >-
          uv run --no-sync python scripts/e2e_agent_platform.py --browser
          --report reports/testing/agent-platform-browser.json
      - name: Publish explicit acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rags-agent-platform-browser
          path: reports/testing/agent-platform-browser.json
          if-no-files-found: error

  docker-compose:
    name: Standalone PostgreSQL and pgvector deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate private deployment credentials
        run: |
          umask 077
          python scripts/bootstrap_compose.py
      - name: Verify rendered model and feature configuration
        run: python scripts/check_compose.py --report reports/testing/compose-config.json
      - name: Build and start the actual PostgreSQL stack
        run: docker compose up -d --build --wait
      - name: Verify vector queries and restart persistence
        run: python scripts/check_compose.py --live --report reports/testing/compose-stack.json
      - name: Verify optional OTLP Collector receives real JSON traces and metrics
        run: |
          docker compose --profile observability up -d --wait otel-collector
          docker compose exec -T rags python - <<'PYTHON'
          import json
          import time
          from rags.monitoring import Monitor

          monitor = Monitor(enabled=True, endpoint="http://otel-collector:4318",
                            start_worker=False)
          monitor.record(tenant="synthetic-smoke", route="/query", method="POST",
                         status=200, duration_ms=7.0,
                         start_ns=time.time_ns() - 7_000_000, end_ns=time.time_ns())
          event = monitor._queue.get_nowait()
          for attempt in range(15):
              monitor.flush([event])
              if monitor.snapshot("synthetic-smoke")["otel"]["exported"] == 1:
                  break
              time.sleep(1)
          else:
              raise AssertionError("OpenTelemetry Collector rejected valid OTLP HTTP JSON")
          print("OTLP/HTTP JSON traces and metrics accepted by real local collector")
          PYTHON
          printf '%s\n' '{"collector":"otel/opentelemetry-collector:0.165.0","traces":"accepted","metrics":"accepted"}' \
            > reports/testing/otel-collector-smoke.json
      - name: Publish standalone deployment evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rags-postgres-compose-evidence
          path: reports/testing/
          if-no-files-found: error
      - name: Capture container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - name: Remove disposable containers and data
        if: always()
        run: docker compose --profile observability down -v --remove-orphans

  real-encoders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAGS_ENV: test
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      RAGS_TEST_COLBERT: "1"
      RAGS_TEST_MULTIMODAL: "1"
      RAGS_TEST_ENCODERS: "1"
      RAGS_MODEL_CACHE: /tmp/rags-model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-suffix: encoders
          cache-dependency-glob: |
            uv.lock
            requirements/*.txt
      - uses: actions/cache@v4
        with:
          path: /tmp/rags-model-cache
          key: rags-onnx-colbert-clip-v02-${{ runner.os }}
      - name: Install locked encoder dependencies
        run: |
          uv sync --locked --extra dev --extra encoders --extra vision
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Actual ColBERT and aligned CLIP inference
        run: >-
          python -m pytest -q tests/test_backends.py tests/test_multimodal.py tests/test_semantic_encoder.py tests/test_collection_encoder_actual.py
          -m encoders --require-no-skips
          --test-inventory reports/testing/inventory-encoders.json
          --junitxml reports/testing/junit-encoders.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-encoder-test-evidence
          path: reports/testing/
          if-no-files-found: error

  sentence-transformers:
    name: Actual Sentence Transformers preprocessing and pretrained embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAGS_ENV: test
      RAGS_TEST_SENTENCE_TRANSFORMERS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      RAGS_MODEL_CACHE: /tmp/rags-sentence-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
          enable-cache: true
          cache-suffix: sentence-transformers
          cache-dependency-glob: |
            uv.lock
            requirements/embedding-cpu.txt
      - uses: actions/cache@v4
        with:
          path: /tmp/rags-sentence-models
          key: rags-sentence-minilm-v1-${{ runner.os }}
      - name: Install locked core and hash-locked CPU embedding runtime
        run: |
          uv sync --locked --extra dev --extra tokenizers
          uv pip install --python .venv/bin/python --torch-backend cpu --require-hashes -r requirements/embedding-cpu.txt
      - name: Verify real local tokenizer preprocessing
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_sentence_encoder_actual.py
          --require-no-skips --junitxml reports/testing/sentence-transformers-local.junit.xml
      # The offline-only local fixture initializes Hugging Face process globals.
      # A fresh process keeps the pretrained download gate valid on a cold cache.
      - name: Verify actual trained MiniLM embeddings
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_sentence_model_actual.py
          --require-no-skips --junitxml reports/testing/sentence-transformers-trained.junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentence-transformers-test-evidence
          path: reports/testing/
          if-no-files-found: error

  research-upstreams:
    name: Actual ${{ matrix.engine }} and HTTP lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: raptor
            resource: research_raptor
            tests: tests/test_research_upstreams.py
          - engine: lightrag
            resource: research_lightrag
            tests: tests/test_research_upstreams.py
          - engine: full_graphrag
            resource: research_graphrag
            tests: tests/test_graphrag_actual.py
          - engine: hipporag
            resource: research_hipporag
            tests: tests/test_hipporag_upstream.py
    env:
      RAGS_ENV: test
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      RAGS_MODEL_CACHE: /tmp/rags-research-models
      TIKTOKEN_CACHE_DIR: /tmp/rags-research-tokenizers
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      RAGS_TEST_RESEARCH_UPSTREAMS: ${{ matrix.engine }}
      RAGS_RESEARCH_REPORT_PATH: reports/ci-research-${{ matrix.engine }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-suffix: research-${{ matrix.engine }}
          cache-dependency-glob: |
            uv.lock
            requirements/*.txt
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/rags-research-models
            /tmp/rags-research-tokenizers
          key: rags-research-bge-v03-${{ runner.os }}
      - name: Install isolated pinned CPU dependencies
        run: bash scripts/install_research.sh "${{ matrix.engine }}" "$RUNNER_TEMP/research-venv"
      - name: Execute actual upstream algorithm and trained BGE
        run: >-
          "$RUNNER_TEMP/research-venv/bin/python" -m pytest -q "${{ matrix.tests }}"
          -m "${{ matrix.resource }}" --require-no-skips
          --test-inventory "reports/testing/inventory-${{ matrix.engine }}.json"
          --junitxml "reports/testing/junit-${{ matrix.engine }}.xml"
      - name: Real sidecar and RAG HTTP lifecycle
        run: >-
          "$RUNNER_TEMP/research-venv/bin/python" scripts/e2e_research_v03.py
          --engine "${{ matrix.engine }}" --model-cache "$RAGS_MODEL_CACHE"
          --report "reports/ci-research-${{ matrix.engine }}-http.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-${{ matrix.engine }}-evidence
          path: |
            reports/ci-research-${{ matrix.engine }}*.json
            reports/testing/
          if-no-files-found: error

  admission-runtime:
    name: Actual admission runtime and recorded quality evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RAGS_ENV: test
      HF_HUB_DISABLE_TELEMETRY: "1"
      ORT_DISABLE_TELEMETRY: "1"
      RAGS_MODEL_CACHE: /tmp/rags-answerability-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-suffix: admission-runtime
          cache-dependency-glob: |
            uv.lock
            requirements/*.txt
      - uses: actions/cache@v4
        with:
          path: /tmp/rags-answerability-models
          key: qwen-1.7b-70d244cc-v03-${{ runner.os }}
      - name: Install reproduced CPU answerability runtime
        run: bash scripts/install-answerability.sh "$RUNNER_TEMP/admission-venv"
      - name: Fetch and verify the pinned public checkpoint
        run: |
          "$RUNNER_TEMP/admission-venv/bin/python" - <<'PY'
          import os
          from rags.admission import load_profile
          from rags.answerability import AnswerabilityScorer
          scorer = AnswerabilityScorer(os.environ["RAGS_MODEL_CACHE"], allow_download=True)
          scorer.verify(load_profile("profiles/admission-qwen-v03.json"))
          print("Pinned artifacts, tokenizer, prompt and runtime match the frozen profile")
          PY
      - name: Run actual contract cases and audit recorded full quality evidence
        run: >-
          "$RUNNER_TEMP/admission-venv/bin/python" scripts/verify_admission_runtime.py
          --cache-dir "$RAGS_MODEL_CACHE"
          --report reports/ci-admission-runtime.json
      - name: Distinguish actual runtime checks from recorded quality measurements
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("reports/ci-admission-runtime.json")
          if not path.exists():
              raise SystemExit("No actual-runtime and recorded-evidence report was produced")
          report = json.loads(path.read_text())
          recorded = report["recorded_quality"]
          correctness, quality = recorded["correctness"], recorded["quality"]
          lines = ["## Actual pinned admission runtime", "",
                   "Runtime contract status: **" + report["status"] + "**",
                   "Calibration contract cases scored in this run: " + str(len(report["cases"])),
                   "Frozen profile: " + report["profile_id"], "",
                   "## Recorded full quality evidence", "",
                   "Recorded report: " + recorded["report_path"],
                   "Recorded report SHA-256: " + recorded["report_sha256"],
                   "Recorded measurement time: " + recorded["measured_at"],
                   f"Recorded correctness checks: {correctness['passed_count']}/{correctness['passed_count'] + correctness['failed_count']}",
                   f"Recorded quality checks: {quality['passed_count']}/{quality['passed_count'] + quality['failed_count']}",
                   "Recorded profile promotion status: **" + recorded["promotion_status"] + "**", "",
                   "The full quality measurements are recorded evidence, not newly scored by this PR job.",
                   "A scoring or retrieval change, or proposed promotion, requires a fresh complete enforced benchmark."]
          for item in quality["gates"]:
              if not item["passed"]:
                  lines.append("- Recorded failed quality target: " + json.dumps(item, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(lines) + "\n")
          if not quality["passed"]:
              print("::warning::Recorded frozen-profile quality targets failed; the profile remains unapproved and disabled by default.")
          assert report["status"] == "passed" and len(report["cases"]) == 2
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-runtime-and-recorded-quality
          path: reports/ci-admission-runtime.json

  full-admission-benchmark:
    name: Manual full frozen admission benchmark with enforced quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_admission_benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RAGS_ENV: test
      HF_HUB_DISABLE_TELEMETRY: "1"
      ORT_DISABLE_TELEMETRY: "1"
      RAGS_MODEL_CACHE: /tmp/rags-answerability-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-suffix: admission-full
          cache-dependency-glob: |
            uv.lock
            requirements/*.txt
      - uses: actions/cache@v4
        with:
          path: /tmp/rags-answerability-models
          key: qwen-1.7b-70d244cc-v03-${{ runner.os }}
      - name: Install reproduced CPU answerability runtime
        run: bash scripts/install-answerability.sh "$RUNNER_TEMP/admission-venv"
      - name: Fetch and verify the pinned public checkpoint
        run: |
          "$RUNNER_TEMP/admission-venv/bin/python" - <<'PY'
          import os
          from rags.admission import load_profile
          from rags.answerability import AnswerabilityScorer
          scorer = AnswerabilityScorer(os.environ["RAGS_MODEL_CACHE"], allow_download=True)
          scorer.verify(load_profile("profiles/admission-qwen-v03.json"))
          print("Pinned artifacts, tokenizer, prompt and runtime match the frozen profile")
          PY
      - name: Run the complete frozen benchmark and enforce every quality target
        run: >-
          "$RUNNER_TEMP/admission-venv/bin/python" -m rags.verify_admission
          --profile profiles/admission-qwen-v03.json
          --holdout examples/admission_holdout_v03.json
          --regression examples/eval_v02.json
          --cache-dir "$RAGS_MODEL_CACHE"
          --report reports/ci-full-admission-verification-qwen.json
          --enforce-quality
      - name: Report the fresh benchmark outcome including failed targets
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("reports/ci-full-admission-verification-qwen.json")
          if not path.exists():
              raise SystemExit("No fresh full-benchmark report was produced")
          report = json.loads(path.read_text())
          lines = ["## Fresh full frozen admission benchmark", "",
                   "Frozen profile: " + report["profile_id"],
                   "Runtime correctness: " + str(report["correctness"]["passed"]),
                   "Enforced quality gates: " + str(report["quality"]["passed"]),
                   "Profile promotion status: **" + report["promotion_status"] + "**", "",
                   "This manual run freshly scores the unchanged holdout and original regression files.",
                   "Quality failures fail this job; the report is uploaded even when enforcement exits 2."]
          for item in report["quality"]["gates"]:
              if not item["passed"]:
                  lines.append("- Failed quality target: " + json.dumps(item, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(lines) + "\n")
          if not report["quality"]["passed"]:
              print("::warning::The fresh benchmark failed quality targets; profile promotion remains failed.")
          assert report["enforce_quality"] is True
          assert report["correctness"]["passed"] and report["quality"]["passed"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-frozen-admission-benchmark
          path: reports/ci-full-admission-verification-qwen.json

  crag-trained:
    name: Actual CRAG evaluator and HTTP lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAGS_ENV: test
      RAGS_TEST_RESEARCH_UPSTREAMS: crag
      RAGS_CRAG_MODEL_PATH: /tmp/rags-crag-evaluator
      RAGS_RESEARCH_REPORT_PATH: reports/ci-research-crag.json
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
          enable-cache: true
          cache-suffix: research-crag
          cache-dependency-glob: requirements/research-crag.txt
      - uses: actions/cache@v4
        with:
          path: /tmp/rags-crag-evaluator
          key: crag-evaluator-cec06c4520a5-${{ runner.os }}
      - name: Install isolated hash-locked evaluator runtime
        run: bash scripts/install_research.sh crag "$RUNNER_TEMP/crag-venv"
      - name: Provision and hash-verify the authors' actual evaluator
        run: >-
          "$RUNNER_TEMP/crag-venv/bin/python" scripts/crag_local.py download
