name: RAGs CI

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAGS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,pdf,mcp,vision]"
      - name: Static analysis
        run: ruff check rags tests --select E4,E7,E9,F
      - name: Labelled retrieval evaluation
        run: python -m rags.evaluate --dataset examples/eval_baseline.json --k 3
      - name: Integration tests
        run: pytest -q
      - name: Real HTTP smoke test
        shell: bash
        run: |
          uvicorn rags.api:app --host 127.0.0.1 --port 8000 &
          pid=$!
          trap "kill $pid || true" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/live && break
            sleep 1
          done
          curl -fsS -H "Authorization: Bearer local-development-key" http://127.0.0.1:8000/health
